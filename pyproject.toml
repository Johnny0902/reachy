[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reachy2023-pour"
version = "0.1.0"
description = "Imitation-learning lab for Reachy 2023: pick up a beaker, pour, and put it down with Quest 2 and LeRobot."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
robot = ["reachy-sdk>=0.5.0", "opencv-python-headless>=4.8"]
dev = ["pytest>=8"]

[project.scripts]
reachy-pour = "reachy_pour.cli:main"

[tool.setuptools.packages.find]
include = ["reachy_pour*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
